plugins {
    id 'java-library'
}

description = 'Renderer-independent graph models, ASM analyzers, builders, exporters, and caches.'

dependencies {
    api "org.ow2.asm:asm:${rootProject.ext.asmVersion}"
    api "org.ow2.asm:asm-tree:${rootProject.ext.asmVersion}"
    implementation "org.ow2.asm:asm-util:${rootProject.ext.asmVersion}"
    implementation "org.ow2.asm:asm-analysis:${rootProject.ext.asmVersion}"
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
}
