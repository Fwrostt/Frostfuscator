plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow'
}

description = 'JavaFX desktop GUI packaging.'

def javafxPlatform = org.gradle.internal.os.OperatingSystem.current().isWindows()
        ? 'win'
        : (org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? 'mac' : 'linux')

configurations {
    guiRuntime
}

def generatedVersionResources = layout.buildDirectory.dir('generated/version-resources')

sourceSets {
    main {
        resources.srcDir(generatedVersionResources)
    }
}

dependencies {
    implementation project(':frost-core')

    implementation('io.github.mkpaz:atlantafx-base:2.0.1') {
        exclude group: 'org.openjfx'
    }
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.4.0'
    implementation 'org.kordamp.ikonli:ikonli-feather-pack:12.4.0'
    implementation('org.fxmisc.richtext:richtextfx:0.11.7') {
        exclude group: 'org.openjfx'
    }
    implementation('org.reactfx:reactfx:2.0-M6') {
        exclude group: 'org.openjfx'
    }
    implementation 'org.vineflower:vineflower:1.12.0'
    implementation 'org.benf:cfr:0.152'
    implementation 'org.bitbucket.mstrobel:procyon-compilertools:0.6.0'
    implementation "org.ow2.asm:asm-util:${rootProject.ext.asmVersion}"
    implementation 'org.webjars.npm:cytoscape:3.33.4'

    compileOnly "org.openjfx:javafx-base:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    compileOnly "org.openjfx:javafx-graphics:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    compileOnly "org.openjfx:javafx-controls:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    compileOnly "org.openjfx:javafx-media:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    compileOnly "org.openjfx:javafx-web:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    compileOnly "org.openjfx:javafx-swing:${rootProject.ext.javafxVersion}:${javafxPlatform}"

    guiRuntime "org.openjfx:javafx-base:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    guiRuntime "org.openjfx:javafx-graphics:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    guiRuntime "org.openjfx:javafx-controls:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    guiRuntime "org.openjfx:javafx-media:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    guiRuntime "org.openjfx:javafx-web:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    guiRuntime "org.openjfx:javafx-swing:${rootProject.ext.javafxVersion}:${javafxPlatform}"

    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
    testImplementation 'org.testfx:testfx-core:4.0.18'
    testImplementation 'org.testfx:testfx-junit5:4.0.18'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation "org.openjfx:javafx-base:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testImplementation "org.openjfx:javafx-graphics:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testImplementation "org.openjfx:javafx-controls:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testImplementation "org.openjfx:javafx-media:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testImplementation "org.openjfx:javafx-web:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testImplementation "org.openjfx:javafx-swing:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testRuntimeOnly "org.openjfx:javafx-base:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testRuntimeOnly "org.openjfx:javafx-graphics:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testRuntimeOnly "org.openjfx:javafx-controls:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testRuntimeOnly "org.openjfx:javafx-media:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testRuntimeOnly "org.openjfx:javafx-web:${rootProject.ext.javafxVersion}:${javafxPlatform}"
    testRuntimeOnly "org.openjfx:javafx-swing:${rootProject.ext.javafxVersion}:${javafxPlatform}"
}

application {
    mainClass = 'dev.frost.obfuscator.gui.GuiMain'
}

jar {
    enabled = false
}

shadowJar {
    enabled = false
}

tasks.register('runGui', JavaExec) {
    group = 'application'
    description = 'Build required GUI classes and run the Frostfuscator desktop GUI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.frost.obfuscator.gui.GuiMain'
    jvmArgs '--module-path', configurations.guiRuntime.asPath,
            '--add-modules', 'javafx.controls,javafx.media,javafx.web,javafx.swing',
            '--enable-native-access=javafx.graphics,javafx.media,ALL-UNNAMED'
}

tasks.register('generateVersionResource') {
    outputs.file(generatedVersionResources.map { it.file('frost-version.properties') })
    doLast {
        def output = generatedVersionResources.get().file('frost-version.properties').asFile
        output.parentFile.mkdirs()
        output.text = "version=${project.version}\n"
    }
}

tasks.named('processResources') {
    dependsOn 'generateVersionResource'
}

tasks.register('guiShadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'build'
    description = 'Build a runnable GUI jar'
    archiveFileName.set('Frostfuscator-gui.jar')
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath, project.configurations.guiRuntime]
    manifest {
        attributes(
                'Main-Class': 'dev.frost.obfuscator.gui.GuiMain',
                'Implementation-Version': project.version,
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

tasks.register('writeGuiLaunchers') {
    group = 'build'
    description = 'Write double-click friendly GUI launcher scripts next to the GUI jar'
    dependsOn guiShadowJar

    doLast {
        def libsDir = layout.buildDirectory.dir('libs').get().asFile
        libsDir.mkdirs()
        def windowsLauncher = new File(libsDir, 'Frostfuscator-gui.cmd')
        windowsLauncher.text = '''@echo off
setlocal
set "APP_DIR=%~dp0"
set "APP_JAR=%APP_DIR%Frostfuscator-gui.jar"

set "JAVA_EXE=javaw.exe"
if defined JAVA_HOME if exist "%JAVA_HOME%\\bin\\javaw.exe" set "JAVA_EXE=%JAVA_HOME%\\bin\\javaw.exe"
if exist "C:\\Program Files\\Java\\jdk-21\\bin\\javaw.exe" set "JAVA_EXE=C:\\Program Files\\Java\\jdk-21\\bin\\javaw.exe"
if exist "C:\\Program Files\\Eclipse Adoptium\\jdk-21*\\bin\\javaw.exe" for /d %%J in ("C:\\Program Files\\Eclipse Adoptium\\jdk-21*") do set "JAVA_EXE=%%~fJ\\bin\\javaw.exe"
if exist "C:\\Program Files\\Zulu\\zulu-21*\\bin\\javaw.exe" for /d %%J in ("C:\\Program Files\\Zulu\\zulu-21*") do set "JAVA_EXE=%%~fJ\\bin\\javaw.exe"

start "" "%JAVA_EXE%" --enable-native-access=ALL-UNNAMED -jar "%APP_JAR%"
endlocal
'''
        def debugLauncher = new File(libsDir, 'Frostfuscator-gui-debug.cmd')
        debugLauncher.text = '''@echo off
setlocal
set "APP_DIR=%~dp0"
set "APP_JAR=%APP_DIR%Frostfuscator-gui.jar"

set "JAVA_EXE=java.exe"
if defined JAVA_HOME if exist "%JAVA_HOME%\\bin\\java.exe" set "JAVA_EXE=%JAVA_HOME%\\bin\\java.exe"
if exist "C:\\Program Files\\Java\\jdk-21\\bin\\java.exe" set "JAVA_EXE=C:\\Program Files\\Java\\jdk-21\\bin\\java.exe"
if exist "C:\\Program Files\\Eclipse Adoptium\\jdk-21*\\bin\\java.exe" for /d %%J in ("C:\\Program Files\\Eclipse Adoptium\\jdk-21*") do set "JAVA_EXE=%%~fJ\\bin\\java.exe"
if exist "C:\\Program Files\\Zulu\\zulu-21*\\bin\\java.exe" for /d %%J in ("C:\\Program Files\\Zulu\\zulu-21*") do set "JAVA_EXE=%%~fJ\\bin\\java.exe"

echo Using "%JAVA_EXE%"
"%JAVA_EXE%" --enable-native-access=ALL-UNNAMED -jar "%APP_JAR%"
echo.
echo Exit code: %ERRORLEVEL%
pause
endlocal
'''
    }
}

tasks.matching { it.name in ['distZip', 'distTar', 'shadowDistZip', 'shadowDistTar', 'startScripts', 'startShadowScripts'] }
        .configureEach {
            enabled = false
        }
