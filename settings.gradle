pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'Frostfuscator'

include 'frost-api'
include 'frost-graph'
include 'frost-ir'
include 'frost-runtime'
include 'frost-core'
include 'frost-cli'
include 'frost-gui'
