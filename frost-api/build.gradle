plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api "org.ow2.asm:asm:${rootProject.ext.asmVersion}"
    api "org.ow2.asm:asm-tree:${rootProject.ext.asmVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${rootProject.ext.junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${rootProject.ext.junitVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
    withJavadocJar()
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            artifactId = 'frost-api'

            pom {
                name = 'Frostfuscator Plugin API'
                description = 'Public plugin and extension API for Frostfuscator'
                url = 'https://github.com/Fwrostt/Frostfuscator'

                licenses {
                    license {
                        name = 'Proprietary'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'frost'
                        name = 'Frost'
                    }
                }
            }
        }
    }
}