# Frostfuscator configuration

input: "input.jar"
output: "output.jar"

# Used by renaming passes.
dictionary: "alphabet"

# Dependency JAR folder used for hierarchy checks.
# Accepts a single path or comma/semicolon-separated paths.
libs: ""

libraries:
  # Extra dependency jars, zips, or directories. Directories are scanned recursively by default.
  paths: []
  recursive: true
  runtime: true
  strict: false
  # Detect shaded dependencies and keep them byte-for-byte instead of transforming them.
  auto-detect: true

# Package handling during class renaming: keep, flatten, remove.
package-mode: "keep"
flatten-package: "obf"

# 0 uses fresh randomness. Positive values are used by seed-aware passes.
seed: 0

# Plugin directories scanned for Frostfuscator extension jars.
plugins:
  - "plugins"

# Regex filters for class names.
inclusions: []
exclusions: []

# Parallel class transformation. 0 workers uses the available processor count.
performance:
  parallel: true
  parallelism: 0
  minimumClasses: 32

# Native Protection / FrostJNI.
# Disabled by default because it requires a native C++ compiler and produces
# platform-dependent libraries embedded into the output jar.
frostjni:
  enabled: false
  outputLibraryName: "frostjni_protected"
  windowsDllName: "frostjni_protected.dll"
  linuxSoName: "libfrostjni_protected.so"
  macDylibName: "libfrostjni_protected.dylib"
  useGcc: true
  useClang: true
  useMsvc: true
  mode: "SELECTIVE"
  compileMode: "FAST"
  unityBuild: true
  optimizationLevel: "O2"
  stripSymbols: false
  compressLibrary: false
  generateHeaders: false
  includeClasses: []
  includePackages: []
  includeMethods: []
  includeAnnotations: []
  excludedClasses: []
  excludedPackages: []
  excludedMethods: []
  excludedAnnotations: []
  temporaryDirectory: ""
  keepGeneratedSources: false
  loaderMode: "embedded"
  resourceEmbedding: true
  debugMode: false
  failFast: true
  continueOnFailure: false

transformers:

  # Licensing / DRM
  license-guard:
    enabled: false
    product: "FrostProtectedApp"
    license-id: ""
    customer: ""
    expires-at: ""
    not-before: ""
    grace-days: 0
    hwid-enabled: false
    bind-current-machine: false
    allowed-hwids: ""
    hwid-components: "mac,hostname,os,user,machine-id"
    hwid-salt: "change-me"
    print-hwid-on-failure: true
    token: ""
    token-public-key: ""
    token-secret: ""
    required-features: ""
    clock-rollback: true
    state-required: false
    state-file: ""
    failure-action: "throw"
    failure-message: "License validation failed"
    coverage: "entrypoints"
    inject-clinit: true
    exclusions: []
    inclusions: []

  # Ownership / watermarking
  watermark:
    enabled: true
    owner: "unknown"
    id: "change-me"
    class-annotations: true
    string-field: true
    field-name: "__frost$watermark"

  # Integrity metadata
  integrity:
    enabled: true

  # Runtime protection
  anti-debug:
    enabled: false
    method-name: "__frost$antiDebug"
    check-arguments: true
    check-debug-classes: true
    check-stack: true
    check-timing: true
    shared-helper: true
    helper-class: ""
    timing-iterations: 1000000
    timing-threshold-ms: 80
    check-processes: false

  anti-attach:
    enabled: false
    coverage: "entrypoints"
    require-disable-attach: true
    require-dynamic-agent-disabled: false
    reject-agents: true
    reject-attach-listener: true
    failure-action: "throw"
    runtime-class: ""
    runtime-method: ""

  runtime-self-checksum:
    enabled: false
    coverage: "entrypoints"
    max-classes: 64
    failure-action: "throw"
    runtime-class: ""
    runtime-method: ""

  anti-decompiler:
    enabled: true

  structural-hardening:
    enabled: true
    attributes-per-class: 4
    payload-bytes: 256
    method-attributes: true
    field-attributes: true

  archive-extraction-canary:
    enabled: false
    count: 2
    expanded-size: 1048576
    seed: 0

  junk-code:
    enabled: true
    min-methods-per-class: 1
    max-methods-per-class: 2
    min-fields-per-class: 0
    max-fields-per-class: 1
    seed: 0

  fake-classes:
    enabled: false
    priority: "pre-obfuscation"
    count: 12
    min-methods-per-class: 8
    max-methods-per-class: 16
    min-fields-per-class: 2
    max-fields-per-class: 4
    kind-ratio: "regular:70,interface:10,enum:10,inner:10"
    placement: "package-mode"
    naming: "dictionary"
    custom-pattern: "Fake{index}"
    package: "frost/junk"
    seed: 0

  # Funsies
  inject-banner:
    enabled: false
    text: "Protected by Frostfuscator"
    copies: 1

  emoji-hell:
    enabled: false
    copies: 3

  copypasta-injector:
    enabled: false
    copies: 3

  fake-application:
    enabled: false
    profiles: "minecraft-plugin,networking-stack,enterprise"
    classes-per-profile: 3
    min-methods-per-class: 8
    max-methods-per-class: 24
    min-fields-per-class: 3
    max-fields-per-class: 10
    seed: 0

  chinese-mode:
    enabled: false
    package-mode: "random"
    package-prefix: "冰霜/混淆器"
    rename-members: true
    inject-fun: true
    large-banners: true
    quotes: true
    inject-metadata: true
    inject-strings: true
    min-fun-members: 1
    max-fun-members: 3

  language-mixup:
    enabled: false
    style: "mixed"
    rename-classes: true
    rename-methods: true
    exclusions: []
    inclusions: []

  # Verifier-safe bounded metadata stress. The JVM rejects real cyclic inheritance.
  decompiler-zip-ties:
    enabled: false
    generic-depth: 96
    fields-per-class: 2
    methods-per-class: 2
    class-signature: true
    exclusions: []
    inclusions: []

  troll-stack-traces:
    enabled: false
    message: "  /\\_/\\\\\n ( o.o )  Frost says: stack trace unavailable\n  > ^ <"
    exclusions: []
    inclusions: []

  # Resource handling
  resource-compression:
    enabled: false
    remove-originals: true
    output-prefix: "META-INF/frostfuscator/resources/"

  resource-encryption:
    enabled: false
    remove-originals: false
    output-prefix: "META-INF/frostfuscator/encrypted/"
    seed: 0

  resource-steganography:
    enabled: false
    password: "change-me"
    extensions: "json,yml,yaml,properties,xml,conf,cfg,ini,key,pem"
    remove-originals: true

  resource-splitting:
    enabled: false
    part-size: 32768
    minimum-size: 65536
    remove-originals: true

  # Optimization
  aggressive-inlining:
    enabled: false
    max-instructions: 12
    remove-inlined-methods: true
    exclusions: []
    inclusions: []

  dead-code-elimination:
    enabled: false
    remove-private-fields: true
    exclusions: []
    inclusions: []

  bytecode-optimizer:
    enabled: true

  jar-shrinker:
    enabled: false

  # Reporting
  statistics-report:
    enabled: true
    format: "json"
    output: "frost-report.json"

  # Existing obfuscation passes
  class-rename:
    enabled: true
    mode: "aggressive"
    exclusions: []
    inclusions: []

  field-rename:
    enabled: true
    mode: "aggressive"
    exclusions:
      - "serialVersionUID"
    inclusions: []

  method-rename:
    enabled: true
    mode: "aggressive"
    exclusions:
      - "main"
    inclusions: []

  kotlin-metadata-remap:
    enabled: true
    exclusions: []
    inclusions: []

  local-variable-rename:
    enabled: true
    exclusions: []
    inclusions: []

  remove-debug:
    enabled: true
    remove-source-file: true
    remove-line-numbers: true
    remove-local-variables: true
    remove-parameters: true
    remove-kotlin-metadata: false
    exclusions: []
    inclusions: []

  # Runs before rename collection, injects only into existing classes, and then
  # participates in later rename, flow, indirection, and encryption passes.
  string-splitting:
    enabled: true
    min-length: 4
    min-fragments: 4
    max-fragments: 32
    max-fragment-length: 3
    carrier-classes: 6
    indirection-depth: 2
    decoys-per-string: 1
    encode-fragments: true
    preserve-reflection-strings: true
    max-strings-per-class: 256
    max-method-instructions: 6000
    max-output-method-instructions: 12000
    seed: 0
    exclusions: []
    inclusions: []

  string-encryption:
    enabled: true
    mode: "heavy"
    min-length: 1
    exclusions: []
    inclusions: []

  classloader-encryption:
    enabled: false
    encryptMainClass: true
    algorithm: "AES/GCM/NoPadding"
    resourcePath: "classes.db"
    compressClasses: true
    failOnError: true
    exclusions: []
    inclusions: []

  virtualization:
    enabled: false
    probability: 15
    max-method-instructions: 300
    min-method-instructions: 8
    skip-initializers: true
    encrypt-bytecode: true
    max-locals: 256
    max-stack: 512
    seed: 0
    exclusions: []
    inclusions: []

  number-obfuscation:
    enabled: true
    probability: 80
    max-per-method: 96
    max-per-class: 256
    exclusions: []
    inclusions: []

  mixed-boolean-arithmetic:
    enabled: true
    probability: 45
    rounds: 1
    operations: "add,sub,and,or,xor,neg"
    max-per-method: 48
    max-per-class: 192
    max-method-instructions: 6000
    max-output-method-instructions: 12000
    include-synthetic: false
    seed: 0
    exclusions: []
    inclusions: []

  parameter-encryption:
    enabled: true
    probability: 30
    exclusions: []
    inclusions: []

  flow-obfuscation:
    enabled: true
    mode: "heavy"
    exception-guards: true
    stack-noise: true
    flatten: true
    flatten-probability: 45
    flatten-min-blocks: 3
    flatten-max-blocks: 48
    flatten-min-complexity: 8
    flatten-cost-budget: 384
    dispatcher-styles: "lookup,table,computed"
    partial-flattening-rate: 45
    partial-region-rate: 55
    flatten-hot-loops: false
    state-reencode-rate: 60
    fake-dispatcher-states: 2
    block-clone-rate: 15
    max-exception-handlers: 0
    predicate-rate: 8
    max-predicates-per-method: 24
    predicate-families: "arithmetic,bitwise,reversible,modular,lookup-table,stateful,argument-derived,interprocedural"
    predicate-sources: "volatile,thread,environment,time"
    predicate-cost-budget: 96
    predicate-camouflage-rate: 25
    predicate-local-rate: 25
    heavy-predicates-in-loops: false
    hot-loop-max-predicate-cost: 2
    volatile-predicate-state: true
    min-method-instructions: 12
    max-method-instructions: 5000
    max-output-method-instructions: 12000
    include-synthetic: false
    seed: 0
    exclusions: []
    inclusions: []

  stack-manipulation:
    enabled: true
    probability: 8
    max-per-method: 16
    exclusions: []
    inclusions: []

  reflection-hiding:
    enabled: true
    probability: 35
    owner-prefixes: "java/io,java/net,java/nio/file,java/util/zip,java/util/jar"
    excluded-owners: "java/io/PrintStream,java/io/Console"
    max-per-method: 24
    max-per-class: 96
    max-method-instructions: 6000
    include-synthetic: false
    seed: 0
    exclusions: []
    inclusions: []

  invoke-dynamic:
    enabled: true
    probability: 35
    mutable-callsites: true
    exclusions: []
    inclusions: []

  condy-indirection:
    enabled: false
    probability: 45
    constants: true
    method-handles: true
    var-handles: true
    exclusions: []
    inclusions: []

  reference-hiding:
    enabled: true
    probability: 45
    max-per-class: 96
    exclusions: []
    inclusions: []

  access-modifier:
    enabled: true
    synthetic: true
    bridge-methods: false
    relax-final: false
    exclusions: []
    inclusions: []

  metadata-noise:
    enabled: true
    strings-per-class: 8
    deprecated: true
    signatures: true
    exclusions: []
    inclusions: []

  flow-outliner:
    enabled: true
    probability: 25
    max-per-class: 16
    exclusions: []
    inclusions: []

  flow-range:
    enabled: true
    probability: 35
    exclusions: []
    inclusions: []

  flow-condition:
    enabled: true
    probability: 25
    max-per-method: 16
    exclusions: []
    inclusions: []

  flow-exception:
    enabled: true
    strength: "AGGRESSIVE"
    exclusions: []
    inclusions: []

  exception-return:
    enabled: false
    exclusions: []
    inclusions: []

  flow-switch:
    enabled: true
    probability: 75
    exclusions: []
    inclusions: []

mapping:
  enabled: true
  output: "mapping.yml"
  format: "yaml"
  encrypted: false
  # The password value is read at runtime and is never stored in this file.
  passwordEnvironment: "FROST_MAPPING_PASSWORD"
